name: ZV PoC tests + benchmarks

# Dedicated workflow for the ZV (vector sorted set) PoC branch.
# - zv-test runs on every push: build + ZV tests + ZSET regression.
# - zv-bench measures dims 1/2/4/8/16 throughput. On push it uses a
#   small N for a quick sanity signal; use workflow_dispatch with
#   n=1000000 for the full PoC numbers.

on:
  push:
    branches:
      - 'poc/zv-multiscore'
  workflow_dispatch:
    inputs:
      n:
        description: 'Members per dimension'
        required: false
        default: '1000000'
      dims:
        description: 'Dimensions to measure'
        required: false
        default: '1 2 4 8 16'

concurrency:
  group: zv-poc-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BENCH_N: ${{ github.event.inputs.n || '20000' }}
  BENCH_DIMS: ${{ github.event.inputs.dims || '1 2 4' }}

jobs:
  zv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build
        run: |
          sudo apt-get install -y tcl8.6 tclx
          make -j"$(nproc)"
      - name: ZV tests
        run: ./runtest --single unit/type/zvset --verbose --dump-logs
      - name: ZSET regression tests
        run: ./runtest --single unit/type/zset --verbose --dump-logs

  zv-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build
        run: make -j"$(nproc)"
      - name: Run ZV benchmark
        run: |
          ./src/valkey-server --port 7778 --daemonize yes --save '' --appendonly no --logfile /tmp/zv-bench.log
          sleep 1
          tclsh utils/zv_benchmark.tcl --port 7778 --n "$BENCH_N" --dims "$BENCH_DIMS" --out /tmp/zv-bench.tsv | tee /tmp/zv-bench.txt
          ./src/valkey-cli -p 7778 SHUTDOWN NOSAVE || true
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## ZV benchmark (N=$BENCH_N, dims: $BENCH_DIMS)"
            echo '```'
            cat /tmp/zv-bench.txt 2>/dev/null || echo "benchmark did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a7725b0dfc5864424b1174f33f38a3a76ed # v6.0.0
        with:
          name: zv-bench-N${{ env.BENCH_N }}
          path: |
            /tmp/zv-bench.tsv
            /tmp/zv-bench.txt
          if-no-files-found: warn
