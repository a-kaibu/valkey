name: ZV PoC tests + benchmarks

# Dedicated workflow for the ZV (vector sorted set) PoC branch.
# - zv-test runs on every push: build + ZV tests + ZSET regression.
# - zv-asan runs the ZV tests under AddressSanitizer.
# - zv-bench runs the full basic benchmark (N=1000000, dims 1/2/4/8/16,
#   spread+shared) on push and on workflow_dispatch. With bench=all it
#   additionally runs the range/pop/setops/query benchmark scripts.

on:
  push:
    branches:
      - 'poc/zv-multiscore'
  workflow_dispatch:
    inputs:
      n:
        description: 'Members per dimension'
        required: false
        default: '1000000'
      dims:
        description: 'Dimensions to measure'
        required: false
        default: '1 2 4 8 16'
      ab_base:
        description: 'Base ref for the A/B server-CPU comparison (default: previous commit)'
        required: false
        default: ''
      bench:
        description: 'Benchmark set (basic or all scripts)'
        required: false
        default: 'basic'
        type: choice
        options:
          - basic
          - all

concurrency:
  group: zv-poc-${{ github.head_ref || github.ref }}
  # Never cancel ZV runs: each push's test/bench results must survive
  # newer pushes.
  cancel-in-progress: false

permissions:
  contents: read

env:
  BENCH_N: ${{ github.event.inputs.n || '1000000' }}
  BENCH_DIMS: ${{ github.event.inputs.dims || '1 2 4 8 16' }}
  BENCH_SET: ${{ github.event.inputs.bench || 'basic' }}

jobs:
  zv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          sudo apt-get install -y tcl8.6 tclx
          make -j"$(nproc)"
      - name: ZV tests
        run: ./runtest --single unit/type/zvset --verbose --dump-logs
      - name: ZSET regression tests
        run: ./runtest --single unit/type/zset --verbose --dump-logs

  zv-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with AddressSanitizer
        run: |
          sudo apt-get install -y tcl8.6 tclx
          make -j"$(nproc)" SANITIZER=address
      - name: ZV tests under ASan
        run: ./runtest --single unit/type/zvset --verbose --dump-logs

  # A/B comparison of server-side execution time (INFO commandstats)
  # between a base build and this commit, on the same runner. Pushes
  # compare against the previous head of the branch.
  zv-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve base
        id: base
        run: |
          base="${{ github.event.inputs.ab_base }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
          echo "sha=$(git rev-parse "$base")" >> "$GITHUB_OUTPUT"
      - name: Build head and base
        run: |
          sudo apt-get install -y tcl8.6
          # valkey-cli drives the server start/stop waits below.
          make -j"$(nproc)" valkey-server valkey-cli
          cp src/valkey-server /tmp/valkey-server-head
          git worktree add /tmp/base "${{ steps.base.outputs.sha }}"
          make -C /tmp/base -j"$(nproc)" valkey-server
          cp /tmp/base/src/valkey-server /tmp/valkey-server-base
      - name: Run A/B (alternating, 3 rounds)
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            for side in base head; do
              /tmp/valkey-server-$side --port 7790 --daemonize yes --save '' --appendonly no --logfile /tmp/ab-$side.log
              # Bounded waits: a server that fails to start or stop, or a
              # benchmark that stalls, fails the job instead of hanging it.
              timeout 30 bash -c 'until ./src/valkey-cli -p 7790 ping 2>/dev/null | grep -q PONG; do sleep 0.2; done'
              timeout 600 tclsh utils/zv_cpu_benchmark.tcl --port 7790 --n 30000 --dims 16 --repeats 5 > /tmp/ab-$side-$round.tsv
              ./src/valkey-cli -p 7790 SHUTDOWN NOSAVE || true
              timeout 30 bash -c 'while ./src/valkey-cli -p 7790 ping >/dev/null 2>&1; do sleep 0.2; done'
            done
          done
      - name: Summarize A/B
        if: always()
        run: |
          python3 - <<'PY' | tee /tmp/ab-summary.md >> "$GITHUB_STEP_SUMMARY"
          import glob, statistics
          def load(side):
              runs = {}
              for path in sorted(glob.glob(f"/tmp/ab-{side}-*.tsv")):
                  for line in open(path):
                      if line.startswith("#") or line.startswith("case"):
                          continue
                      f = line.rstrip("\n").split("\t")
                      runs.setdefault(f[0], []).append(float(f[1]))
              return {k: statistics.median(v) for k, v in runs.items()}
          base, head = load("base"), load("head")
          print("## ZV A/B server time (median of 3 rounds, us/command, N=30000, dims=16)")
          print("base: `${{ steps.base.outputs.sha }}`  head: `${{ github.sha }}`")
          print()
          print("| case | base us | head us | speedup |")
          print("|---|---:|---:|---:|")
          for case in head:
              if case not in base:
                  continue
              b, h = base[case], head[case]
              ratio = f"{b / h:.2f}x" if h > 0 else "n/a"
              print(f"| {case} | {b:.3f} | {h:.3f} | {ratio} |")
          PY
      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zv-ab
          path: /tmp/ab-*
          if-no-files-found: warn

  zv-bench:
    runs-on: ubuntu-latest
    # GitHub-hosted max: 6h. Full bench (N=1M, all dims, both dists).
    timeout-minutes: 360
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: make -j"$(nproc)"
      - name: Run ZV benchmark
        run: |
          set -euo pipefail
          ./src/valkey-server --port 7778 --daemonize yes --save '' --appendonly no --logfile /tmp/zv-bench.log
          sleep 1
          tclsh utils/zv_benchmark.tcl --port 7778 --n "$BENCH_N" --dims "$BENCH_DIMS" --out /tmp/zv-bench.tsv --json /tmp/zv-bench.jsonl | tee /tmp/zv-bench.txt
          if [ "${BENCH_SET:-basic}" = "all" ]; then
            # Extended scripts run capped at N=100K to bound CI time.
            if [ "$BENCH_N" -gt 100000 ]; then EXTRA_N=100000; else EXTRA_N="$BENCH_N"; fi
            tclsh utils/zv_range_benchmark.tcl --port 7778 --n "$EXTRA_N" --out /tmp/zv-range-bench.tsv --json /tmp/zv-range-bench.jsonl | tee -a /tmp/zv-bench.txt
            tclsh utils/zv_pop_benchmark.tcl --port 7778 --n "$EXTRA_N" --out /tmp/zv-pop-bench.tsv --json /tmp/zv-pop-bench.jsonl | tee -a /tmp/zv-bench.txt
            tclsh utils/zv_setops_benchmark.tcl --port 7778 --n "$EXTRA_N" --out /tmp/zv-setops-bench.tsv --json /tmp/zv-setops-bench.jsonl | tee -a /tmp/zv-bench.txt
            tclsh utils/zv_query_benchmark.tcl --port 7778 --n "$EXTRA_N" --out /tmp/zv-query-bench.tsv --json /tmp/zv-query-bench.jsonl | tee -a /tmp/zv-bench.txt
          fi
          ./src/valkey-cli -p 7778 SHUTDOWN NOSAVE || true
      - name: Verify benchmark completion
        run: |
          set -euo pipefail
          test -s /tmp/zv-bench.tsv
          test -s /tmp/zv-bench.jsonl
          grep -q "medians over repeats" /tmp/zv-bench.txt
          grep -q "reps 5" /tmp/zv-bench.tsv
          python3 -c "import json;[json.loads(l) for l in open('/tmp/zv-bench.jsonl')]"
          if [ "${BENCH_SET:-basic}" = "all" ]; then
            for f in range pop setops query; do
              test -s /tmp/zv-$f-bench.tsv
              test -s /tmp/zv-$f-bench.jsonl
            done
          fi
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## ZV benchmark (N=$BENCH_N, dims: $BENCH_DIMS)"
            echo '```'
            cat /tmp/zv-bench.txt 2>/dev/null || echo "benchmark did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zv-bench-N${{ env.BENCH_N }}-${{ env.BENCH_SET }}
          path: |
            /tmp/zv-bench.tsv
            /tmp/zv-bench.jsonl
            /tmp/zv-bench.txt
            /tmp/zv-range-bench.tsv
            /tmp/zv-range-bench.jsonl
            /tmp/zv-pop-bench.tsv
            /tmp/zv-pop-bench.jsonl
            /tmp/zv-setops-bench.tsv
            /tmp/zv-setops-bench.jsonl
            /tmp/zv-query-bench.tsv
            /tmp/zv-query-bench.jsonl
          if-no-files-found: warn
