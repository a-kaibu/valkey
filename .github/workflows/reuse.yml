name: REUSE Compliance Check

permissions:
  contents: read

on:
  push:
    branches-ignore:
      # PoC branch: skip non-test checks (use zv-poc.yml instead)
      - 'poc/zv-multiscore'
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'

concurrency:
  group: reuse-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
