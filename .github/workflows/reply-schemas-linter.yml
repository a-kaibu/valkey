name: Reply-schemas linter

on:
  push:
    branches-ignore:
      # PoC branch: skip non-test checks (use zv-poc.yml instead)
      - 'poc/zv-multiscore'
    paths:
      - 'src/commands/*.json'
  pull_request:
    paths:
      - 'src/commands/*.json'

concurrency:
  group: reply-schemas-linter-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reply-schemas-linter:
    if: github.head_ref != 'poc/zv-multiscore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: Install packages
        working-directory: utils/reply-schema-linter
        run: npm ci --ignore-scripts
      - name: linter
        run: NODE_PATH=utils/reply-schema-linter/node_modules node ./utils/reply_schema_linter.js

